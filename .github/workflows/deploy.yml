name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Supabase 凭据由 GitHub Actions Secrets 注入（仓库 Settings → Secrets and variables → Actions）
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      # 供应链安全：actions 全部 pin 到 commit SHA（2026-09-06，防 tag 被上游重指向）
      # actions/checkout@v4 → f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      # actions/setup-node@v4 → 94196ee1d15439c1b6651cd87ef14e88ec435966
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fix SPA routing
        run: cp dist/index.html dist/404.html
      # actions/upload-pages-artifact@v3 → 98ef48e41587a300b82de4cf298aa98b57b2faae
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: dist
      # actions/deploy-pages@v4 → 368f82528645a54fb793d4d04e342629a3f51346
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

