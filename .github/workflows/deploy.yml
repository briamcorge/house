name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Fix SPA routing
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: r0adkll/setup-android@v1
        with:
          sdk-version: '34'
          build-tools-version: '34.0.0'
      - run: npm ci
      - name: Build web for APK
        run: npm run build
        env:
          VITE_BASE: './'
          VITE_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Copy web assets and build APK
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.ts android/app/src/main/assets/capacitor.config.json 2>/dev/null || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: house-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
