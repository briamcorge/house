name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Fix SPA routing
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Build web for APK
        run: npm run build
        env:
          VITE_BASE: './'
          VITE_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Build APK
        run: |
          # 手动复制 web 资源到 Android 项目
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.ts android/app/src/main/assets/capacitor.config.json 2>/dev/null || true
          # 构建 APK，输出到日志文件
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== GRADLE BUILD FAILED ==="
            tail -100 gradle.log
            exit 1
          fi
      - name: Upload Gradle log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: android/gradle.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: house-management-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
